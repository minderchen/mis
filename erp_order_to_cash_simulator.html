      database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
      arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
      shield:'<path d="M12 2 3 6v6c0 5 3 8 9 10 6-2 9-5 9-10V6z"/><path d="m8 12 3 3 5-5"/>',
      search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      minus:'<path d="M5 12h14"/>',
      refresh:'<path d="M20 11a8 8 0 0 0-14-5L3 9M3 4v5h5M4 13a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/>',
      file:'<path d="M6 2h8l5 5v15H6zM14 2v5h5M9 12h7M9 16h7"/>',
      credit:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
      layers:'<path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/>',
      user:'<circle cx="12" cy="7" r="4"/><path d="M4 22c0-5 3-8 8-8s8 3 8 8"/>',
      alert:'<path d="m12 2 10 18H2zM12 9v5M12 18h.01"/>'
    };
    const ico=(name,klass='ico')=>`<svg class="${klass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.grid}</svg>`;
    const money=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function init(){return {page:'dashboard',stage:0,qty:10,customer:clients[0],picked:0,paymentMethod:'Bank transfer',paymentRef:'BANK-2026-0148',financeTab:'receivables',selectedStep:1,events:[],confirmReset:false,toast:''}}
    let S=init();let toastTimer;
    const stockOnHand=()=>INITIAL_STOCK-(S.stage>=3?S.qty:0);
    const stockReserved=()=>S.stage===2?S.qty:0;
    const stockAvailable=()=>stockOnHand()-stockReserved();
    const orderTotal=()=>S.qty*UNIT_PRICE;
    const costTotal=()=>S.qty*UNIT_COST;
    const customerName=()=>S.customer;
    const status=()=>['No order','Draft','Confirmed','Shipped','Invoiced','Paid'][S.stage];
    const timeline=[
      {title:'Enter order',dep:'Sales',detail:'Capture the customer order',screen:'sales'},
      {title:'Reserve stock',dep:'Inventory',detail:'Allocate available laptops',screen:'sales'},
      {title:'Ship goods',dep:'Warehouse',detail:'Pick and post delivery',screen:'warehouse'},
      {title:'Post invoice',dep:'Finance',detail:'Recognize receivable and revenue',screen:'finance'},
      {title:'Collect payment',dep:'Finance',detail:'Settle receivable',screen:'finance'}
    ];
    function logEvent(name,detail,icon='check'){S.events.unshift({name,detail,icon,at:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});}
    function toast(msg){S.toast=msg;clearTimeout(toastTimer);renderToast();toastTimer=setTimeout(()=>{S.toast='';renderToast()},4300)}
    function renderToast(){const old=document.getElementById('erp-toast');if(old)old.remove();if(S.toast){const d=document.createElement('div');d.id='erp-toast';d.className='toast';d.setAttribute('role','status');d.innerHTML=ico('check')+`<span>${esc(S.toast)}</span>`;document.body.appendChild(d)}}
    function nav(p){S.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
    function task(){if(S.stage===0||S.stage===1)nav('sales');else if(S.stage===2)nav('warehouse');else if(S.stage===3||S.stage===4)nav('finance');else nav('process')}
    function nextTask(){const data=[['Create a sales order','Enter 10 laptops for Acme Business Solutions.','sales','Open Sales Orders'],['Confirm & reserve inventory','Reserve the goods before warehouse fulfillment.','sales','Confirm the Order'],['Pick and ship the order','Fulfill the order so stock physically leaves the warehouse.','warehouse','Open Warehouse'],['Create a customer invoice','Post the invoice to create accounts receivable and revenue.','finance','Open Finance'],['Receive the payment','Record cash and clear the outstanding receivable.','finance','Record Payment'],['Process completed!','All five stages are finished. Inspect the final cross-department audit trail.','process','Review Process']];return data[S.stage]}
    function titlehead(name,description,eyebrow='ENTERPRISE OPERATIONS') {return `<div class="page-header"><div><div class="eyebrow">${eyebrow}</div><h1>${name}</h1><p>${description}</p></div><div class="step-count">Progress <strong>${Math.max(0,S.stage-0)}/5</strong></div></div>`}
    function eventHTML(limit=99){if(!S.events.length)return `<div class="empty">${ico('clock')}Actions will appear here as you process the sales order.</div>`;return `<div class="event-list">${S.events.slice(0,limit).map(e=>`<div class="event"><div class="event-bubble">${ico(e.icon)}</div><div><div class="event-name">${esc(e.name)}</div><div class="event-detail">${esc(e.detail)}</div></div><div class="event-time">${esc(e.at)}</div></div>`).join('')}</div>`}
    function stepsHTML(){return `<div class="process-flow">${timeline.map((t,i)=>{let done=S.stage>=i+1,active=S.stage===i;return `<div class="flow-step ${done?'done':active?'active':''}"><div class="number">${done?ico('check'):i+1}</div><b>${t.title}</b><small>${t.dep}</small></div>`}).join('')}</div>`}
    function dashboard(){let next=nextTask();return `${titlehead('Operations Overview','Watch how one customer order connects sales, inventory, warehouse, and accounting.','ERP LEARNING LAB')}
      <div class="hero"><div><div class="small">INTERACTIVE BUSINESS SIMULATION</div><h2>One order. Multiple departments. One source of truth.</h2><p>Follow an order for 10 laptops through a complete order-to-cash workflow. Every action updates a shared business record.</p></div><div class="hero-graphic"><div class="hero-icon">${ico('cart')}<small>Sales</small></div><span class="hero-arrow">→</span><div class="hero-icon">${ico('box')}<small>Stock</small></div><span class="hero-arrow">→</span><div class="hero-icon">${ico('truck')}<small>Ship</small></div><span class="hero-arrow">→</span><div class="hero-icon">${ico('wallet')}<small>Finance</small></div></div></div>
      <div class="kpi-grid">
        ${kpi('Order value',S.stage?money(orderTotal()):'$0','Customer order entered','cart')}
        ${kpi('Stock available',stockAvailable()+' units','25 units at simulation start','box')}
        ${kpi('Accounts receivable',money(S.stage===4?orderTotal():0),'Open customer balance','receipt')}
        ${kpi('Cash collected',money(S.stage>=5?orderTotal():0),'Payments recorded','wallet')}
      </div>
      <div class="split"><div class="card"><div class="card-head"><h2>End-to-end transaction</h2><span>${S.stage} of 5 steps complete</span></div><div class="card-body">${stepsHTML()}<div class="hint" style="margin-top:19px"><div class="hint-title">${ico('info')} MIS concept: process integration</div><p>A sales order does not automatically mean cash or revenue. Confirmation reserves inventory; shipping reduces physical stock; invoicing establishes a receivable; payment settles it.</p></div></div></div>
      <div><div class="next-up"><div class="pre">YOUR NEXT ACTION</div><h3>${next[0]}</h3><p>${next[1]}</p><button class="btn" data-action="task">${next[3]} ${ico('arrow')}</button></div><div class="card"><div class="card-head"><h2>Activity feed</h2><span>Live transaction log</span></div><div class="card-body">${eventHTML(3)}</div></div></div></div>`}
    function kpi(lbl,num,foot,ic){return `<div class="card kpi"><div class="kpi-head"><span>${lbl}</span>${ico(ic)}</div><div class="kpi-num">${num}</div><div class="kpi-foot">${foot}</div></div>`}
    function sales(){const editable=S.stage===0,confirm=S.stage===1,order=S.stage>0;return `${titlehead('Sales Orders','You are a sales representative. Create and confirm a customer order.','SALES & DISTRIBUTION')}
      <div class="module-grid"><div class="card"><div class="card-head"><h2>${editable?'New sales order':'Sales order '+ORDER_ID}</h2><span class="tag ${S.stage===0?'gray':S.stage>=5?'green':S.stage>=2?'blue':'amber'}">${status()}</span></div><div class="card-body"><div class="notice info" style="margin-bottom:20px">${ico('info')} <div><b>Sales perspective:</b> Your job is to capture demand and confirm inventory availability. Creating a draft order does not change stock.</div></div>
      <div class="field"><label for="customer">Sold-to customer</label><select id="customer" data-field="customer" ${editable?'':'disabled'}>${clients.map(c=>`<option ${S.customer===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="two-fields"><div class="field"><label for="sku">Material / SKU</label><input id="sku" value="LTP-100 · Business Laptop" disabled></div><div class="field"><label for="qty">Order quantity</label><input id="qty" type="number" min="1" max="40" step="1" value="${S.qty}" data-field="qty" ${editable?'':'disabled'}><div class="field-hint">Try 30 units to see an insufficient-stock warning.</div></div></div>
      <div class="two-fields"><div class="field"><label for="unit">Unit selling price</label><input id="unit" value="$1,000.00" disabled></div><div class="field"><label for="needby">Requested delivery</label><input id="needby" value="Standard fulfillment" disabled></div></div>
      <div class="order-total"><div><div class="lbl">Sales order total</div><div class="field-hint">${S.qty} × ${money(UNIT_PRICE)} per laptop</div></div><strong>${money(orderTotal())}</strong></div>
      ${editable?(S.qty>stockAvailable()?`<div class="notice warn" style="margin-bottom:12px">${ico('alert')} Not enough available stock: ${stockAvailable()} units available for an order of ${S.qty}. Reduce the order quantity.</div>`:`<div class="notice info" style="margin-bottom:12px">${ico('check')} Stock check: ${stockAvailable()} available; requested ${S.qty} units.</div>`):''}
      ${editable?`<button class="btn full" data-action="create" ${!(S.qty>=1&&S.qty<=stockAvailable()&&Number.isInteger(S.qty))?'disabled':''}>${ico('file')} Create Sales Order</button>`:''}
      ${confirm?`<div class="notice" style="margin-bottom:12px">${ico('check')} Sales order saved as a draft. No inventory is reserved yet.</div><button class="btn full" data-action="confirm">${ico('shield')} Confirm Order & Reserve ${S.qty} Units</button>`:''}
      ${S.stage>=2?`<div class="notice">${ico('check')} ${S.stage>=3?'This order was fulfilled and sent to the next department.':'Order confirmed. '+S.qty+' units are reserved for fulfillment.'}</div><button class="btn secondary full" style="margin-top:12px" data-nav="${S.stage===2?'warehouse':'process'}">${S.stage===2?'Open Warehouse Worklist':'View Cross-Department Process'} ${ico('arrow')}</button>`:''}
      </div></div>
      <div><div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Shared order record</h2><span>Real-time ERP data</span></div><div class="card-body"><div class="record"><div><div class="key">Order number</div><div class="val">${order?ORDER_ID:'Not assigned'}</div></div><div><div class="key">Customer</div><div class="val">${esc(S.customer)}</div></div></div><div class="record"><div><div class="key">Item / SKU</div><div class="val">LTP-100</div></div><div><div class="key">Quantity</div><div class="val">${S.qty} laptops</div></div></div><div class="record"><div><div class="key">Inventory reservation</div><div class="val">${S.stage===2?S.qty:0} units</div></div><div><div class="key">Fulfillment status</div><div class="val">${S.stage>=3?'Shipped':'Not shipped'}</div></div></div><div class="record"><div><div class="key">Invoice</div><div class="val">${S.stage>=4?INVOICE_ID:'Not posted'}</div></div><div><div class="key">Payment</div><div class="val">${S.stage===5?'Received':'Not received'}</div></div></div></div></div><div class="hint"><div class="hint-title">${ico('database')} Where does this data go?</div><p>Sales shares the order quantity with Inventory and Warehouse. Finance uses the order and delivery to prepare an invoice. Everyone sees the same customer and product identifiers.</p></div></div></div>`}
    function inventory(){const on=stockOnHand(),res=stockReserved(),avail=stockAvailable();return `${titlehead('Inventory Management','See the difference between inventory that exists, inventory allocated, and inventory ready to sell.','MATERIALS MANAGEMENT')}
      <div class="card" style="margin-bottom:18px"><div class="card-head"><h2>Stock overview · LTP-100 Business Laptop</h2><span>Warehouse WH-01 / Bin A1-B04</span></div><div class="card-body"><div class="stock-top"><div class="stat-tile"><span>On hand</span><strong>${on}</strong><small>Physical stock in warehouse</small></div><div class="stat-tile"><span>Reserved</span><strong style="color:#bd7d21">${res}</strong><small>Committed to customer orders</small></div><div class="stat-tile"><span>Available to promise</span><strong style="color:#245edf">${avail}</strong><small>On hand − reserved</small></div></div>
      <div class="stacked" role="img" aria-label="Inventory available ${avail} units, reserved ${res} units, total on-hand ${on} units"><div class="in-stock" style="width:${avail/INITIAL_STOCK*100}%"></div><div class="reserved" style="width:${res/INITIAL_STOCK*100}%"></div></div>
      <div class="legend"><span><i class="swatch" style="background:#2875e8"></i> Available (${avail})</span><span><i class="swatch" style="background:#f0aa3d"></i> Reserved (${res})</span><span><i class="swatch" style="background:#e8edf5"></i> Shipped (${INITIAL_STOCK-on})</span></div></div></div>
      <div class="split"><div class="card"><div class="card-head"><h2>Inventory change log</h2><span>Stock movements & reservations</span></div><div class="card-body table-scroll"><table class="table"><thead><tr><th>Event</th><th>Reference</th><th>On-hand change</th><th>Reserved change</th></tr></thead><tbody><tr><td>Opening balance</td><td>INITIAL</td><td>+25</td><td>—</td></tr>${S.stage>=2?`<tr><td>Order reservation</td><td>${ORDER_ID}</td><td>—</td><td>+${S.qty}</td></tr>`:''}${S.stage>=3?`<tr><td>Goods issue / shipment</td><td>${SHIP_ID}</td><td>−${S.qty}</td><td>−${S.qty}</td></tr>`:''}</tbody></table></div></div>
      <div><div class="hint" style="margin-bottom:15px"><div class="hint-title">${ico('info')} Why reservation matters</div><p>When Sales confirms the order, the system allocates ${S.stage>=2?S.qty:10} laptops. Physical stock does not decrease until Warehouse posts shipment. This prevents the same units from being promised twice.</p></div><div class="card"><div class="card-head"><h2>Inventory business rule</h2></div><div class="card-body"><div class="order-total"><div><div class="lbl">Available to promise</div><div class="field-hint">On hand − reserved</div></div><strong>${on} − ${res} = ${avail}</strong></div>${S.stage===0?`<button class="btn full" data-nav="sales">Create a Sales Order ${ico('arrow')}</button>`:S.stage===1?`<button class="btn full" data-nav="sales">Confirm Order to Reserve ${ico('arrow')}</button>`:S.stage===2?`<button class="btn full" data-nav="warehouse">Fulfill Reserved Stock ${ico('arrow')}</button>`:`<div class="notice">${ico('check')} Shipment posted. Physical stock is now ${on} units.</div>`}</div></div></div></div>`}
    function warehouse(){const canPick=S.stage===2,shipped=S.stage>=3;return `${titlehead('Warehouse Fulfillment','Work as a warehouse associate. Pick the reserved goods and post the goods issue.','WAREHOUSE MANAGEMENT')}
      <div class="module-grid"><div class="card"><div class="card-head"><h2>Outbound delivery worklist</h2><span class="tag ${shipped?'green':canPick?'amber':'gray'}">${shipped?'Dispatched':canPick?'Ready to pick':'Waiting for order'}</span></div><div class="card-body">${S.stage<2?`<div class="empty">${ico('truck')}There is no confirmed order available for picking.</div><button class="btn full" data-nav="sales">${S.stage===0?'Create Sales Order':'Confirm Sales Order'} ${ico('arrow')}</button>`:
      `<div class="record"><div><div class="key">Delivery ID</div><div class="val">${SHIP_ID}</div></div><div><div class="key">Sales order</div><div class="val">${ORDER_ID}</div></div></div><div class="record"><div><div class="key">Ship to</div><div class="val">${esc(S.customer)}</div></div><div><div class="key">Storage bin</div><div class="val">WH-01 / A1-B04</div></div></div>
      <div class="field" style="margin-top:21px"><label>Pick list</label><div class="order-total"><div><div style="font-weight:800">LTP-100 · Business Laptop</div><div class="field-hint">Required: ${S.qty} units</div></div><span class="tag blue">${S.qty} EA</span></div></div>
      <div class="qbox"><div class="qty-display">${shipped?S.qty:S.picked}<span> / ${S.qty} picked</span></div><div style="margin-left:auto;display:flex;gap:7px"><button class="btn outline" title="Remove one picked unit" aria-label="Remove one picked unit" data-action="decrement" ${!canPick||S.picked===0?'disabled':''}>${ico('minus')}</button><button class="btn outline" title="Pick one unit" aria-label="Pick one unit" data-action="increment" ${!canPick||S.picked>=S.qty?'disabled':''}>${ico('plus')}</button></div></div><div class="pick-track"><div class="pick-fill" style="width:${(shipped?100:S.picked/S.qty*100)}%"></div></div>
      ${canPick?`<button class="btn secondary full" style="margin-bottom:9px" data-action="pickall">${ico('box')} Pick All ${S.qty} Units</button><button class="btn full" data-action="ship" ${S.picked===S.qty?'':'disabled'}>${ico('truck')} Post Goods Issue & Ship Order</button><div class="field-hint" style="text-align:center;margin-top:9px">To post shipment, picked quantity must equal ordered quantity.</div>`:`<div class="notice">${ico('check')} Goods issue posted. ${S.qty} laptops left the warehouse.</div><button class="btn secondary full" style="margin-top:12px" data-nav="finance">Open Customer Invoicing ${ico('arrow')}</button>`}`}</div></div>
      <div><div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Stock impact</h2></div><div class="card-body"><div class="record"><div><div class="key">Before goods issue</div><div class="val">25 units on hand</div></div><div><div class="key">After goods issue</div><div class="val">${shipped?25-S.qty:'Pending'} ${shipped?'units on hand':''}</div></div></div><div class="record"><div><div class="key">Inventory cost per unit</div><div class="val">${money(UNIT_COST)}</div></div><div><div class="key">Cost of goods sold</div><div class="val">${shipped?money(costTotal()):'$0'} posted</div></div></div></div></div><div class="hint"><div class="hint-title">${ico('database')} What changes in ERP?</div><p>Posting goods issue reduces on-hand inventory, releases the reservation, creates a shipment record, and—for this teaching example—posts ${money(costTotal())} in cost of goods sold. The customer invoice is a separate step.</p></div></div></div>`}
    function journals(){let j=[];if(S.stage>=3)j.push({ref:SHIP_ID,desc:'Goods issue',dr:'Cost of goods sold',cr:'Inventory',value:costTotal()});if(S.stage>=4)j.push({ref:INVOICE_ID,desc:'Customer invoice',dr:'Accounts receivable',cr:'Sales revenue',value:orderTotal()});if(S.stage>=5)j.push({ref:PAYMENT_ID,desc:'Customer payment',dr:'Cash',cr:'Accounts receivable',value:orderTotal()});return j}
    function finance(){const canInvoice=S.stage===3,canPay=S.stage===4;return `${titlehead('Finance & Accounting','Now act as an accounts receivable clerk. Invoice the customer, then record payment.','RECORD TO REPORT')}
      <div class="ledger-grid"><div class="ledger-tile"><small>Customer invoiced</small><b>${S.stage>=4?money(orderTotal()):'$0'}</b></div><div class="ledger-tile"><small>Open receivable</small><b>${S.stage===4?money(orderTotal()):'$0'}</b></div><div class="ledger-tile"><small>Cash collected</small><b style="color:#0d956d">${S.stage>=5?money(orderTotal()):'$0'}</b></div></div>
      <div class="module-grid"><div class="card"><div class="card-head"><h2>Customer financial transaction</h2><span class="tag ${S.stage===5?'green':S.stage===4?'amber':'gray'}">${S.stage===5?'Payment cleared':S.stage===4?'Payment due':'Awaiting invoice'}</span></div><div class="card-body"><div class="tabs"><button class="tab ${S.financeTab==='receivables'?'active':''}" data-finance-tab="receivables">Accounts Receivable</button><button class="tab ${S.financeTab==='ledger'?'active':''}" data-finance-tab="ledger">General Ledger</button></div>
      ${S.financeTab==='receivables'?`<div style="padding-top:17px"><div class="record"><div><div class="key">Customer</div><div class="val">${esc(S.customer)}</div></div><div><div class="key">Order / Invoice</div><div class="val">${ORDER_ID} / ${S.stage>=4?INVOICE_ID:'Pending'}</div></div></div><div class="record"><div><div class="key">Goods shipped</div><div class="val">${S.stage>=3?S.qty+' units':'Not yet'}</div></div><div><div class="key">Billable amount</div><div class="val">${money(orderTotal())}</div></div></div><div class="record"><div><div class="key">Outstanding amount</div><div class="val">${money(S.stage===4?orderTotal():0)}</div></div><div><div class="key">Payment status</div><div class="val">${S.stage===5?'Fully paid':S.stage===4?'Unpaid':'Not invoiced'}</div></div></div>
      ${S.stage<3?`<div class="notice warn" style="margin-top:16px">${ico('alert')} The sales order must be shipped before invoicing in this example.</div><button class="btn secondary full" style="margin-top:12px" data-nav="${S.stage<2?'sales':'warehouse'}">Go to ${S.stage<2?'Sales Orders':'Warehouse'} ${ico('arrow')}</button>`:''}
      ${canInvoice?`<div class="notice info" style="margin:16px 0">${ico('info')} Shipment verified. Posting the invoice will debit Accounts Receivable and credit Sales Revenue for ${money(orderTotal())}.</div><button class="btn full" data-action="invoice">${ico('receipt')} Post Customer Invoice</button>`:''}
      ${canPay?`<div class="notice" style="margin:16px 0">${ico('check')} Invoice ${INVOICE_ID} posted. The customer now owes ${money(orderTotal())}.</div><hr class="separate"><div class="field"><label for="paymethod">Payment method</label><select id="paymethod" data-field="paymentMethod"><option ${S.paymentMethod==='Bank transfer'?'selected':''}>Bank transfer</option><option ${S.paymentMethod==='Credit card'?'selected':''}>Credit card</option><option ${S.paymentMethod==='Check'?'selected':''}>Check</option></select></div><div class="field"><label for="payref">Payment reference</label><input id="payref" value="${esc(S.paymentRef)}" data-field="paymentRef" maxlength="40"></div><div class="order-total"><span class="lbl">Payment received</span><strong>${money(orderTotal())}</strong></div><button class="btn positive full" data-action="payment" ${S.paymentRef.trim()?'':'disabled'}>${ico('credit')} Receive & Post Payment</button>`:''}
      ${S.stage===5?`<div class="notice" style="margin-top:18px">${ico('check')} Invoice ${INVOICE_ID} is fully settled. ${money(orderTotal())} moved from Accounts Receivable to Cash.</div><button class="btn secondary full" style="margin-top:12px" data-nav="process">Review Complete Process ${ico('arrow')}</button>`:''}</div>`:
      `<div style="padding-top:18px"><div class="notice info" style="margin-bottom:16px">${ico('info')} Each journal entry must balance: total debits equal total credits.</div><div class="table-scroll"><table class="table"><thead><tr><th>Document</th><th>Debit (Dr)</th><th>Credit (Cr)</th><th class="amount">Amount</th></tr></thead><tbody>${journals().length?journals().map(j=>`<tr><td>${j.ref}</td><td>${j.dr}</td><td>${j.cr}</td><td class="amount">${money(j.value)}</td></tr>`).join(''):`<tr><td colspan="4" style="text-align:center;color:#7e8fa2;padding:30px">No journal entries posted yet.</td></tr>`}</tbody></table></div></div>`}
      </div></div>
      <div><div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Accounting impact</h2><span>Changes from this order only</span></div><div class="card-body"><div class="record"><div><div class="key">Cash (increase)</div><div class="val">${money(S.stage>=5?orderTotal():0)}</div></div><div><div class="key">Accounts receivable (net)</div><div class="val">${money(S.stage===4?orderTotal():0)}</div></div></div><div class="record"><div><div class="key">Sales revenue (increase)</div><div class="val">${money(S.stage>=4?orderTotal():0)}</div></div><div><div class="key">Inventory (decrease)</div><div class="val">${money(S.stage>=3?costTotal():0)}</div></div></div><div class="record"><div><div class="key">Cost of goods sold (increase)</div><div class="val">${money(S.stage>=3?costTotal():0)}</div></div><div><div class="key">Gross profit</div><div class="val" style="color:#13856b">${S.stage>=4?money(orderTotal()-costTotal()):'Not yet recognized'}</div></div></div></div></div><div class="hint"><div class="hint-title">${ico('info')} Accounting note</div><p>This simplified teaching model recognizes sales revenue when invoiced and cost of goods sold when shipped. In real companies, revenue recognition depends on the contract, delivery terms, and accounting policies.</p></div></div></div>`}
    function process(){const i=Math.min(5,Math.max(1,S.selectedStep)),data=[
      {title:'1 · Enter Sales Order',module:'Sales',impact:'Records customer demand. No inventory is reserved and no accounting entry is made.',data:'Customer, material, quantity, selling price, order ID.',change:'Sales order created (draft).'},
      {title:'2 · Confirm and Reserve',module:'Sales + Inventory',impact:'Allocates units to this order. On-hand stock stays the same, while stock available to other orders decreases.',data:'Reservation linked to the original sales order.',change:`Reserved: +${S.qty} units. Available: −${S.qty} units.`},
      {title:'3 · Pick and Ship',module:'Warehouse + Inventory + Finance',impact:'Reduces physical on-hand inventory and releases the reservation. This demo records cost of goods sold.',data:'Delivery reference, warehouse bin, goods issue, cost value.',change:`On hand: −${S.qty}; reserved: −${S.qty}. Dr COGS / Cr Inventory ${money(costTotal())}.`},
      {title:'4 · Post Invoice',module:'Finance',impact:'Creates the customer invoice and an outstanding receivable. Revenue is recognized in this simplified example.',data:'Invoice ID, customer, source order, sales price.',change:`Dr Accounts Receivable / Cr Sales Revenue ${money(orderTotal())}.`},
      {title:'5 · Receive Payment',module:'Finance',impact:'Records the incoming money and clears the outstanding balance.',data:'Receipt ID, payment method, bank reference, invoice.',change:`Dr Cash / Cr Accounts Receivable ${money(orderTotal())}.`}
    ],item=data[i-1];return `${titlehead('Process Explorer','Select a process step to see its business impact and the data shared across departments.','INTEGRATED BUSINESS PROCESS')}
      <div class="card" style="margin-bottom:18px"><div class="card-head"><h2>Order-to-cash: a connected value chain</h2><span>Click any step to explore</span></div><div class="card-body"><div class="diagram">${timeline.map((t,j)=>`<button class="diagram-node ${S.selectedStep===j+1?'chosen':''} ${S.stage>=j+1?'done':''}" data-step="${j+1}">${ico(['cart','box','truck','receipt','wallet'][j])}<b>${t.title}</b><small>${t.dep}</small><div style="margin-top:9px"><span class="tag ${S.stage>=j+1?'green':S.stage===j?'blue':'gray'}">${S.stage>=j+1?'Complete':S.stage===j?'Next':'Pending'}</span></div></button>`).join('')}</div><div class="hint"><div class="hint-title">${ico('info')} Shared transaction record</div><p>A unique sales order reference follows the transaction. Later documents—including the shipment, invoice, and payment—can be traced back to that order.</p></div></div></div>
      <div class="learning-grid"><div class="card"><div class="card-head"><h2>${item.title}</h2><span class="tag ${S.stage>=i?'green':S.stage===i-1?'blue':'gray'}">${S.stage>=i?'Completed':S.stage===i-1?'Next step':'Not yet reached'}</span></div><div class="card-body"><div class="eyebrow">OWNER: ${item.module.toUpperCase()}</div><h3 style="font-size:15px;margin:10px 0 5px">Why it matters</h3><p style="color:#62768f;font-size:13px;line-height:1.7;margin:0 0 18px">${item.impact}</p><div class="comparison" style="margin-bottom:12px"><h3>Data created or reused</h3><p>${item.data}</p></div><div class="comparison"><h3>Business system change</h3><p>${item.change}</p></div><button class="btn secondary" style="margin-top:18px" data-nav="${timeline[i-1].screen}">Open ${labels[timeline[i-1].screen]} ${ico('arrow')}</button></div></div>
      <div class="card"><div class="card-head"><h2>End-to-end audit trail</h2><span>${S.events.length} events recorded</span></div><div class="card-body">${eventHTML()}</div></div></div>
      ${S.stage===5?`<div class="notice" style="margin-top:17px;font-weight:700">${ico('check')} Simulation complete: an order worth ${money(orderTotal())} has been fulfilled, invoiced, and paid. ${S.qty} laptops were shipped; gross profit is ${money(orderTotal()-costTotal())} before other costs.</div>`:''}`}
    function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">${ico('layers')}</div><div><div class="brand-title">NEXUS</div><div class="brand-sub">ERP Learning Lab</div></div></div><div><div class="nav-title">WORKSPACE</div><nav class="nav" aria-label="ERP modules">${[['dashboard','grid'],['sales','cart'],['inventory','box'],['warehouse','truck'],['finance','wallet'],['process','network']].map(([p,i])=>`<button class="nav-btn ${S.page===p?'active':''}" data-nav="${p}" ${S.page===p?'aria-current="page"':''}>${ico(i)}<span>${labels[p]}</span>${p==='process'?'<span class="nav-tag">LAB</span>':''}</button>`).join('')}</nav></div><div class="sidebar-bottom"><div class="lab-chip">● SANDBOX ENVIRONMENT</div><p>Practice realistic workflows. No real customers, payments, or inventory are affected.</p><button class="reset-btn" data-action="requestreset">${ico('refresh')} Reset Simulation</button></div></aside>`}
    function mobileNav(){return `<nav class="mobile-nav" aria-label="Mobile ERP modules">${[['dashboard','grid','Home'],['sales','cart','Sales'],['inventory','box','Stock'],['warehouse','truck','Ship'],['finance','wallet','Finance'],['process','network','Flow']].map(([p,ic,l])=>`<button class="${S.page===p?'active':''}" data-nav="${p}">${ico(ic)}${l}</button>`).join('')}</nav>`}
    function modal(){return S.confirmReset?`<div class="modal-back" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">Restart the ERP simulation?</h2><p>This will clear the sales order, stock reservations, shipment, invoice, payment, and audit trail. You can replay the workflow from the beginning.</p><div class="modal-actions"><button class="btn outline" data-action="cancelreset">Cancel</button><button class="btn" data-action="reset">Reset all data</button></div></div></div>`:''}
    function render(){const content=({dashboard,sales,inventory,warehouse,finance,process}[S.page]||dashboard)();document.getElementById('app').innerHTML=`<div class="shell">${sidebar()}<main class="main"><header class="topbar"><div class="crumb">Nexus ERP <span>›</span> <strong>${labels[S.page]}</strong></div><div class="top-right"><span class="status-pill"><i class="dot"></i> DEMO MODE</span><button class="mobile-reset" data-action="requestreset" title="Restart simulation" aria-label="Restart simulation">${ico('refresh')}</button><div class="userrole"><b>${roles[S.page]}</b>Training account</div><div class="avatar">ML</div></div></header><div class="workspace">${content}<footer class="footer-note">Nexus ERP Lab is a fictional teaching interface. All transactions and accounting amounts are simulated for learning purposes. No server or external services are used.</footer></div></main></div>${mobileNav()}${modal()}`;renderToast()}
    function act(action){switch(action){
      case 'task':task();return;
      case 'create':if(S.stage!==0||!Number.isInteger(S.qty)||S.qty<1||S.qty>INITIAL_STOCK){toast('Enter a valid quantity that available stock can cover.');return;}S.stage=1;logEvent('Sales order created',`${ORDER_ID} · ${S.qty} laptops · ${money(orderTotal())}`,'cart');toast('Draft sales order created. Inventory is not reserved yet.');break;
      case 'confirm':if(S.stage!==1)return;S.stage=2;logEvent('Inventory reserved',`${S.qty} units allocated to ${ORDER_ID}`,'box');toast('Order confirmed. Inventory reserved; physical stock unchanged.');break;
      case 'increment':if(S.stage!==2)return;S.picked=Math.min(S.qty,S.picked+1);break;
      case 'decrement':if(S.stage!==2)return;S.picked=Math.max(0,S.picked-1);break;
      case 'pickall':if(S.stage!==2)return;S.picked=S.qty;toast(`${S.qty} laptops picked from bin A1-B04.`);break;
      case 'ship':if(S.stage!==2||S.picked!==S.qty){toast('Pick the full order before posting shipment.');return;}S.stage=3;logEvent('Goods issue & shipment posted',`${SHIP_ID} · ${S.qty} laptops shipped · COGS ${money(costTotal())}`,'truck');toast('Shipment posted. On-hand inventory and reservation updated.');break;
      case 'invoice':if(S.stage!==3)return;S.stage=4;S.financeTab='receivables';logEvent('Customer invoice posted',`${INVOICE_ID} · Accounts receivable ${money(orderTotal())}`,'receipt');toast('Invoice posted. Revenue and receivable recorded.');break;
      case 'payment':if(S.stage!==4||!S.paymentRef.trim()){toast('Enter a payment reference.');return;}S.stage=5;logEvent('Customer payment received',`${PAYMENT_ID} · ${money(orderTotal())} · ${S.paymentMethod} · ${S.paymentRef}`,'wallet');toast('Payment posted. Customer receivable is now zero.');break;
      case 'requestreset':S.confirmReset=true;break;
      case 'cancelreset':S.confirmReset=false;break;
      case 'reset':S=init();clearTimeout(toastTimer);S.toast='Simulation restarted. Begin with a new sales order.';break;
      default:return;
    }render();}
    document.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){nav(navEl.dataset.nav);return;}const tab=e.target.closest('[data-finance-tab]');if(tab){S.financeTab=tab.dataset.financeTab;render();return;}const step=e.target.closest('[data-step]');if(step){S.selectedStep=Number(step.dataset.step);render();return;}const action=e.target.closest('[data-action]');if(action){act(action.dataset.action);return;}});
    document.addEventListener('change',e=>{const name=e.target.dataset.field;if(!name)return;switch(name){case 'qty':S.qty=Number(e.target.value);break;case 'customer':if(clients.includes(e.target.value))S.customer=e.target.value;break;case 'paymentMethod':S.paymentMethod=e.target.value;break;case 'paymentRef':S.paymentRef=e.target.value;break;default:return;}render();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.confirmReset){S.confirmReset=false;render()}});
    window.erpLab={getState:()=>JSON.parse(JSON.stringify(S)),getSummary:()=>({stage:S.stage,onHand:stockOnHand(),reserved:stockReserved(),available:stockAvailable(),orderValue:S.stage?orderTotal():0,receivable:S.stage===4?orderTotal():0,cash:S.stage>=5?orderTotal():0,entries:journals()})};
    render();
  </script>
</body>
</html>
